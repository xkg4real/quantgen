status: AUDITED, UNSIGNED - proposed v1.0.0 from the calendar audit (docs/audit/2026-10-27/04_calendar_batch2.md); refused
  at load until the owner signs (R-20 rule 6, T-CAL-01)
covers:
  from: '1995-01-01'
  to: '2027-12-31'
coverage_calendar: WEEKDAYS
signed_off_by: null
signed_utc: null
md5: null
how_to_sign: verify every row against its official source, fill source_url and signed_off_by on every row, set signed_off_by
  / signed_utc at file level, set md5 to the content md5 printed by `python -m core.calendars.store`, and add the matching
  MANIFEST.yaml row with a new test id
unverified:
- publisher times (H.15 16:15, H.10 Monday 16:15, Treasury 18:00, Cboe 16:15 ET) are the spec's values; the publisher pages
  were not re-read (network policy)
- 'dependencies outside this file: VIXCLS_CBOE needs holidays_CBOE and ECOS_USDKRW needs holidays_ECOS (both empty); BLS and
  BEA need release dates from the M5 event store. Those series fail closed until then'
- VIXCLS_FRED lag and KODEX200_PDF instant are the spec's conservative defaults until the owner's measurement
owner_must_sign:
- the two M1 measurements (FRED VIX posting lag over 20 sessions; KODEX 200 basket instant)
- BLS and BEA release calendars
