# was read from them by hand and is cross-checked by build_proposed.py against the ALFRED first-release dates
# (alfred_first_release.csv, alfred_vintages.csv) wherever the release has already happened.
#
# retrieved_at_utc: the BEA and FRED prints carry a header time of 29/10/2026 02:27-02:43 in the owner's time zone
# (KST, UTC+9), i.e. 2026-10-28 17:27-17:43 UTC; the BLS prints carry none and take the upload time (17:44 UTC).
# Times are local America/New_York unless stated; FRED lists the claims report at 7:30 am US Central = 08:30 ET.

