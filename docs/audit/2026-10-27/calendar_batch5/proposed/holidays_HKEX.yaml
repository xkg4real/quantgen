unverified:
- rows before 2025 (the Korea-covariance span) are a later version
- half days close at 12:10 (end of the closing auction); severe-weather trading since 2024-09-23 means a typhoon no longer
  closes the market, but an 'exceptional situation' closure would be a new version
owner_must_sign:
- HKEX trading calendar incl. half-day closes, with licence, owner and md5 (spec section 9.5)
