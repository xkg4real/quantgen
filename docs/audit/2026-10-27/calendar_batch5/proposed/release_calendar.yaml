file_id: release_calendar
version: 1.0.0
status: AUDITED, UNSIGNED - proposed v1.0.0 (docs/audit/2026-10-27/12_release_calendar.md); refused at load until the owner
  signs (R-20 rule 6, T-CAL-01)
covers:
  from: '2025-01-01'
  to: '2027-12-31'
coverage_calendar: FED
signed_off_by: null
signed_utc: null
md5: null
description: 'BLS, BEA and DOL release dates (spec L1448, L1851): one row per release and reference period whose release date
  falls in the covered range. period = the FRED observation date (first of the month; the week-ending Saturday for CLAIMS);
  release_date and time are local America/New_York. A period without a row has no release date and stays unpublished (October
  2025 CPI was cancelled). Releases: CPI -> CPIAUCSL, CPILFESL; EMPSIT -> UNRATE, PAYEMS, SAHMREALTIME; PIO -> PCEPI, PCEPILFE;
  CLAIMS -> ICSA.'
how_to_sign: verify every row against its official source, then run `python -m tools.sign_calendars --signer "<name>" --expect
  release_calendar=<md5> release_calendar` after the file is copied in and its MANIFEST.yaml row added
unverified:
- 'CLAIMS 2027 (52 rows, evidence C): FRED listed no 2027 claims dates on 2026-10-28; the rows follow the rule that reproduces
  every 2025-2026 date outside the 2025 shutdown (Thursday; Wednesday when the Thursday is a federal holiday: 2027-11-10 Veterans
  Day, 2027-11-24 Thanksgiving); a new version replaces them once DOL publishes'
- 'evidence B rows (one official record): future dates on a single schedule page (BLS November-December 2026, BEA from 2026-10-29,
  FRED claims from 2026-10-29) and 2025 BLS dates before the shutdown, which rest on ALFRED alone; a rescheduled or cancelled
  release is a release event (M5) until a new version'
- 'CPI September 2025 -> 2025-10-24: ALFRED''s first vintage; the 08:30 ET time is BLS''s standard time, not printed on the
  saved pages'
- '1995-2024 release dates are stage 2 (separate approval): those observations stay unpublished'
owner_must_sign:
- BLS, BEA and DOL release dates per release and reference period (spec L1448), with the time of day (four BEA releases were
  at 10:00 ET)
