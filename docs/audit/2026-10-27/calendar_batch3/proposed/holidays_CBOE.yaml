how_to_sign: verify every row against its official source, fill source_url and signed_off_by on every row, set signed_off_by
  / signed_utc at file level, set md5 to the content md5 printed by `python -m core.calendars.store`, and add the matching
  MANIFEST.yaml row with a new test id
unverified:
- the 2026+ Cboe holiday GTH sessions give VIX prints on some NYSE holidays; this calendar is the regular-session official
  close (VIXCLS), so those days stay closed
- early-close times are the 2025-12-24 Cboe notice pattern (13:15 ET); Cboe's own notice for each date governs
- a Cboe-only closure (none seen 2025-2026) is a new version
owner_must_sign:
- Cboe holiday list (VIX official close calendar), with licence, owner and md5 (spec section 9.5)
