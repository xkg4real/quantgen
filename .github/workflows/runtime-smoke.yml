name: Runtime packaging smoke
on:
  push:
    branches: ['gpt/product-workflow-20261029', 'gpt/ui-apply-main-20261029']
  pull_request:
    paths: ['pyproject.toml', 'requirements.txt', 'assets/**', 'tests/web_branding_acceptance.py', 'main.py', 'core/app_paths.py', 'core/ficc/bonds.py', 'core/ficc/equity_deriv.py', 'core/ficc/forward_conventions.py', 'core/ficc/ratesim.py', 'tests/rates_revaluation_params_acceptance.py', 'core/quant/backtest.py', 'core/ficc/letf_assumptions.py', 'tests/letf_assumptions_acceptance.py', 'tests/letf_io_guard_acceptance.py', 'tests/letf_ai_payload_acceptance.py', 'tests/signals_trade_count_acceptance.py', 'tests/forward_convention_acceptance.py', 'tests/fx_basis_disclosure_acceptance.py', 'tests/cms_coupon_disclosure_acceptance.py', 'core/ficc/structured.py', 'core/ficc/insights.py', 'tests/bond_funding_acceptance.py', 'core/crypto/analytics.py', 'core/crypto/values.py', 'data/crypto/crypto_client.py', 'tests/crypto_hac_acceptance.py', 'tests/crypto_missing_values_acceptance.py', 'tests/option_disclosure_acceptance.py', 'tests/mc_bootstrap_disclosure_acceptance.py', 'tests/etf_sleeve_disclosure_acceptance.py', 'tests/ai_payload_acceptance.py', 'tests/ai_output_check_acceptance.py', 'core/quant/insights.py', 'core/quant/optimize.py', 'tests/portfolio_scope_acceptance.py', 'core/quant/montecarlo.py', 'tests/terminal_target_acceptance.py', 'tests/mc_volatility_acceptance.py', 'tests/strategy_exposure_acceptance.py', 'tests/ar1_decay_acceptance.py', 'core/crypto/funding_diagnostic.py', 'tests/funding_inference_acceptance.py', 'tests/letf_disclosure_acceptance.py', 'tests/letf_index_acceptance.py', 'tests/quote_coverage_acceptance.py', 'data/kis_markets.py', 'core/ficc/fx_styles.py', 'core/ficc/fx.py', 'core/ficc/sabr_diagnostics.py', 'tests/sabr_diagnostics_acceptance.py', 'core/ficc/swaps.py', 'tests/ficc_boundary_acceptance.py', 'tests/swaption_conversion_acceptance.py', 'core/research/**', 'core/education/**', 'core/i18n.py', 'core/ui*messages.py', 'tests/indicator_guide_acceptance.py', 'tests/glossary_search_acceptance.py', 'tests/web_indicator_guide_acceptance.py', 'ui/**', 'quantgen_desktop/**', 'tests/desktop*', 'tests/desktop_a3_layout_acceptance.py', 'tests/desktop_a3_reading_acceptance.py', 'docs/product/A3_READING_LAYOUT_2026-11-06.md', 'tools/status/**', 'tools/packaging/**', 'tests/*research*', 'tests/data_readiness_acceptance.py', 'tests/packaging_policy_acceptance.py', 'tests/runtime_syntax_acceptance.py', 'tests/flet_runtime_acceptance.py', '.github/workflows/runtime-smoke.yml', 'core/market/**', 'data/kis_workspace.py', 'data/kis_stream.py', 'tests/market_core_acceptance.py', 'tests/market_routing_acceptance.py', 'tests/market_symbols_acceptance.py', 'tests/market_directory_acceptance.py', 'tests/stock_profile_acceptance.py', 'tests/market_board_core_acceptance.py', 'tests/market_received_bars_acceptance.py', 'tests/market_chart_presentation_acceptance.py', 'tests/kis_workspace_acceptance.py', 'tests/kis_stream_acceptance.py', 'tests/web_market_chart_acceptance.py', 'qa/research_status.json', 'tests/status_snapshot_acceptance.py']
permissions:
  contents: read
jobs:
  syntax:
    name: Runtime syntax (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.env*
            !/**/.env*
            !/docs/asset_expansion/cache/
            !/paper_live/
            !/grokteam/
            !/_backup/
            !/QUANTGEN_techfund_research_bundle/
            !/**/*.jsonl
            !/**/holdout/
            !/**/frozen/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile runtime allowlist without importing providers or user state
        run: python -m unittest tests.runtime_syntax_acceptance -v
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.env*
            !/**/.env*
            !/docs/asset_expansion/cache/
            !/paper_live/
            !/grokteam/
            !/_backup/
            !/QUANTGEN_techfund_research_bundle/
            !/**/*.jsonl
            !/**/holdout/
            !/**/frozen/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Stage only runtime allowlist and build wheel
        shell: bash
        run: |
          python -m pip install build
          python tools/packaging/stage.py --output "$RUNNER_TEMP/quantgen-stage"
          python -m build --wheel --outdir "$RUNNER_TEMP/quantgen-dist" "$RUNNER_TEMP/quantgen-stage"
          python -m pip install "$RUNNER_TEMP"/quantgen-dist/*.whl
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/packaging/smoke_installed.py"
      - name: Verify bounded source fixtures
        shell: bash
        run: |
          python -m unittest tests.packaging_policy_acceptance tests.status_snapshot_acceptance tests.research_home_acceptance tests.research_contract_acceptance tests.data_readiness_acceptance tests.web_branding_acceptance tests.bond_funding_acceptance tests.crypto_hac_acceptance tests.ai_payload_acceptance tests.ai_output_check_acceptance tests.ai_connection_acceptance tests.ficc_boundary_acceptance tests.swaption_conversion_acceptance tests.sabr_diagnostics_acceptance tests.portfolio_scope_acceptance tests.terminal_target_acceptance tests.mc_volatility_acceptance tests.strategy_exposure_acceptance tests.ar1_decay_acceptance tests.funding_inference_acceptance tests.letf_assumptions_acceptance tests.letf_io_guard_acceptance tests.letf_ai_payload_acceptance tests.letf_disclosure_acceptance tests.letf_index_acceptance tests.quote_coverage_acceptance -v
          python -m unittest tests.flet_runtime_acceptance -v
          python -m tools.status.snapshot --check
      - name: Install Linux Qt shared libraries for offscreen verification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Verify native desktop with offline fixtures
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pip install "PyQt6==6.12.0"
          python -m unittest tests.desktop_acceptance tests.desktop_market_acceptance tests.desktop_strategy_acceptance tests.desktop_macro_acceptance tests.desktop_paper_acceptance tests.desktop_commentary_acceptance tests.desktop_portfolio_scope_acceptance tests.desktop_strategy_exposure_acceptance tests.desktop_ar1_decay_acceptance tests.desktop_funding_inference_acceptance tests.desktop_letf_assumptions_acceptance tests.desktop_letf_ai_acceptance tests.desktop_letf_disclosure_acceptance tests.desktop_letf_index_acceptance tests.desktop_quote_coverage_acceptance tests.desktop_swaption_conversion_acceptance tests.desktop_sabr_diagnostics_acceptance tests.desktop_language_acceptance tests.desktop_fx_language_acceptance tests.desktop_carry_language_acceptance tests.desktop_rates_language_acceptance tests.desktop_bonds_portfolio_language_acceptance tests.desktop_market_diagnostics_language_acceptance -v
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/packaging/smoke_desktop.py"
      - name: Verify preference recovery and native macro language switching
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.desktop_startup_acceptance tests.desktop_macro_language_acceptance tests.desktop_authored_prose_language_acceptance -v
      - name: Verify financial result interpretation across native and Flet outputs
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.fx_basis_disclosure_acceptance tests.cms_coupon_disclosure_acceptance tests.signals_trade_count_acceptance tests.forward_convention_acceptance tests.rates_revaluation_params_acceptance tests.crypto_missing_values_acceptance tests.option_disclosure_acceptance tests.mc_bootstrap_disclosure_acceptance tests.etf_sleeve_disclosure_acceptance -v
      - name: Verify shared KIS charts and realtime lifecycle with offline fixtures
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.home_watchlist_acceptance tests.qscore_acceptance tests.watchlist_live_acceptance tests.desktop_watchlist_acceptance tests.desktop_qscore_acceptance tests.desktop_home_live_acceptance tests.desktop_market_layout_acceptance tests.market_core_acceptance tests.market_routing_acceptance tests.market_symbols_acceptance tests.market_board_core_acceptance tests.market_directory_acceptance tests.stock_profile_acceptance tests.desktop_markets_watchlist_acceptance tests.desktop_market_tabs_acceptance tests.market_received_bars_acceptance tests.market_chart_presentation_acceptance tests.kis_workspace_acceptance tests.kis_stream_acceptance tests.desktop_market_chart_acceptance tests.web_market_chart_acceptance -v
      - name: Verify A3 native result layout and local reading help
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.desktop_a3_layout_acceptance tests.desktop_a3_reading_acceptance -v
      - name: Verify native chart text layout
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.desktop_chart_rendering_acceptance tests.desktop_responsive_tools_acceptance tests.desktop_operation_fixes_acceptance tests.desktop_typography_acceptance -v
      - name: Verify indicator education and locale contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.indicator_guide_acceptance tests.glossary_search_acceptance tests.web_indicator_guide_acceptance tests.desktop_indicator_guide_acceptance tests.chart_c_theme_acceptance -v
      - name: Retain the verified installable wheel
        uses: actions/upload-artifact@v4
        with:
          name: QUANTGEN-wheel-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/quantgen-dist/*.whl
          if-no-files-found: error
          retention-days: 7
