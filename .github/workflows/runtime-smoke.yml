name: Runtime packaging smoke
on:
  push:
    branches: ['gpt/product-workflow-20261029', 'gpt/ui-apply-main-20261029']
  pull_request:
    paths: ['pyproject.toml', 'requirements.txt', 'assets/**', 'tests/web_branding_acceptance.py', 'main.py', 'core/app_paths.py', 'core/ficc/bonds.py', 'core/ficc/insights.py', 'tests/bond_funding_acceptance.py', 'core/crypto/analytics.py', 'tests/crypto_hac_acceptance.py', 'tests/ai_payload_acceptance.py', 'core/quant/insights.py', 'core/quant/optimize.py', 'tests/portfolio_scope_acceptance.py', 'core/quant/montecarlo.py', 'tests/terminal_target_acceptance.py', 'tests/mc_volatility_acceptance.py', 'tests/strategy_exposure_acceptance.py', 'tests/ar1_decay_acceptance.py', 'core/crypto/funding_diagnostic.py', 'tests/funding_inference_acceptance.py', 'tests/letf_disclosure_acceptance.py', 'tests/letf_index_acceptance.py', 'data/kis_markets.py', 'core/ficc/fx_styles.py', 'core/ficc/swaps.py', 'tests/ficc_boundary_acceptance.py', 'core/research/**', 'ui/**', 'quantgen_desktop/**', 'tests/desktop*', 'tools/status/**', 'tools/packaging/**', 'tests/*research*', 'tests/data_readiness_acceptance.py', 'tests/packaging_policy_acceptance.py', '.github/workflows/runtime-smoke.yml']
permissions:
  contents: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.env*
            !/**/.env*
            !/docs/asset_expansion/cache/
            !/paper_live/
            !/grokteam/
            !/_backup/
            !/QUANTGEN_techfund_research_bundle/
            !/**/*.jsonl
            !/**/holdout/
            !/**/frozen/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Stage only runtime allowlist and build wheel
        shell: bash
        run: |
          python -m pip install build
          python tools/packaging/stage.py --output "$RUNNER_TEMP/quantgen-stage"
          python -m build --wheel --outdir "$RUNNER_TEMP/quantgen-dist" "$RUNNER_TEMP/quantgen-stage"
          python -m pip install "$RUNNER_TEMP"/quantgen-dist/*.whl
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/packaging/smoke_installed.py"
      - name: Verify bounded source fixtures
        shell: bash
        run: |
          python -m unittest tests.packaging_policy_acceptance tests.status_snapshot_acceptance tests.research_home_acceptance tests.research_contract_acceptance tests.data_readiness_acceptance tests.web_branding_acceptance tests.bond_funding_acceptance tests.crypto_hac_acceptance tests.ai_payload_acceptance tests.ficc_boundary_acceptance tests.portfolio_scope_acceptance tests.terminal_target_acceptance tests.mc_volatility_acceptance tests.strategy_exposure_acceptance tests.ar1_decay_acceptance tests.funding_inference_acceptance tests.letf_disclosure_acceptance tests.letf_index_acceptance -v
          python -m tools.status.snapshot --check
      - name: Install Linux Qt shared libraries for offscreen verification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Verify native desktop with offline fixtures
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m pip install "PyQt6==6.12.0"
          python -m unittest tests.desktop_acceptance tests.desktop_market_acceptance tests.desktop_strategy_acceptance tests.desktop_macro_acceptance tests.desktop_paper_acceptance tests.desktop_commentary_acceptance tests.desktop_portfolio_scope_acceptance tests.desktop_strategy_exposure_acceptance tests.desktop_ar1_decay_acceptance tests.desktop_funding_inference_acceptance tests.desktop_letf_disclosure_acceptance tests.desktop_letf_index_acceptance -v
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/packaging/smoke_desktop.py"
