how_to_sign: verify every row against its official source, fill source_url and signed_off_by on every row, set signed_off_by
  / signed_utc at file level, set md5 to the content md5 printed by `python -m core.calendars.store`, and add the matching
  MANIFEST.yaml row with a new test id
unverified:
- 'the set is CME equity index futures (ES, MES): a business day has a regular daily settlement; other CME products (rates,
  energy) keep different holiday hours'
- early_close times are the equity trading halt in America/Chicago (12:15 CT); the settlement is 12:00 CT
- 2027 rows follow the signed NYSE list (C) until CME publishes its 2027 schedule
- rows before 2025 are a later version
owner_must_sign:
- CME Group holiday calendar, with licence, owner and md5 (spec section 9.5)
