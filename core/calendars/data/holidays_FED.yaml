how_to_sign: verify every row against its official source, fill source_url, retrieved_at_utc and signed_off_by on every
  row, set version, status (without the word UNSIGNED), signed_off_by, signed_utc (quoted 'YYYY-MM-DDTHH:MM:SSZ', before
  2026-10-31T15:00:00Z for the deadline files) and sign_off_statement at file level with md5 null, set md5 to the content
  md5 printed by `python -m core.calendars.store`, and fill the matching MANIFEST.yaml row (version, md5, signed_off_by and
  signed_utc equal to the file) with a new test id
unverified:
- derived by the federal holiday rule with Saturday -> Friday observance (the Board's H.10 practice, brief F-6); owner confirms
  against the Board's holiday schedule
- 'checked 2026-10-28 against federalreserve.gov K.8 and frbservices.org by WebSearch excerpts only (direct reading
  blocked): every 2026 and 2027 row matches; 2027-12-31 added (CAL-05: K.8 lists it as Board closed, Reserve Banks open,
  corrected from December 31, 2028 on 2026-07-08). Saturday holidays close the Board on the Friday while the Reserve
  Banks (Fedwire, FedACH) stay open; this set feeds the Board publication schedule (fed_business_day), so those Fridays
  are closed here. The owner reads the current k8.htm at sign-off'
owner_must_sign:
- Federal Reserve Board holiday schedule 2015 .. 2027 (K.8 / federalreserve.gov)
