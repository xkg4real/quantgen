  unverified: '2026-10-28 공식 출처 대조(WebSearch 발췌만, 원문 직접 열람은 차단: WebFetch ENOTFOUND, 프록시 403): 인사혁신처 보도자료 ''올해부터 노동절, 제헌절 공휴일로''; 대통령령 제36290호(2026-04-30 일부개정. 시행일은 출처가 갈린다: 법령 미러 머리글 ''[시행 2026.05.11.]'', 2026-10-28 검토 검색의 인사처 보도 발췌 ''노동절 2026-05-01, 제헌절 2026-05-11 시행''. 소유자가 law.go.kr 부칙으로 확인한다); KRX 모의거래 게시판 ''2026년 7월 17일(금요일)은 제헌절 로 임시공휴일 입니다''(2026-07-10 게시; 제헌절은 임시공휴일이 아니라 공휴일 재지정이다. 2026-10-28 재검색에서는 이 게시 문구를 재현하지 못했고, 휴장 사실은 KRX 2026-05-20 휴장 공지 보도(bizwatch 2026-05-20)로 확인된다). KRX 2026 올빼미공시 안내 표에는 7/17 행이 없다(개정 전 작성으로 보임). exchange_calendars 4.13.2 XKRX에는 없다. 소유자가 서명할 때 KRX 공지 원문으로 확인한다'
