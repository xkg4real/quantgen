  unverified: '2026-10-28 공식 출처 대조(WebSearch 발췌만, 원문 직접 열람은 차단: WebFetch ENOTFOUND, 프록시 403): 중앙선관위 선거일 2026-06-03(수); 임기만료 선거일은 관공서 공휴일(규정 제2조, 인사혁신처 공휴일제도); KRX 공매도 모의거래인증시스템 게시판 ''2026년 6월 3일(수요일)은 지방선거일로 임시공휴일 입니다''(2026-06-01 게시). KRX 2026-05-20 휴장 보도자료 원문은 krx.co.kr에서 찾지 못했다(언론 보도만). exchange_calendars 4.13.2 XKRX에는 없다. 소유자가 서명할 때 KRX 공지 원문으로 확인한다'
