[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantgpt"
version = "0.0.1"
description = "QuantGPT: contracts, checks and host-tool protocol around one open-weight model"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
ov = ["openvino>=2025.0", "openvino-genai>=2025.0"]
api = ["anthropic>=0.40"]
train = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "datasets>=2.20"]
eval = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["quantgpt*"]
